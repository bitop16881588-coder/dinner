<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聚餐點餐神器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');
        body { font-family: 'Comfortaa', sans-serif; background: #f0f4f8; color: #2c3e50; margin: 0; padding-bottom: 100px; }
        .tabs { display: flex; background: #fff; padding: 10px; gap: 5px; position: sticky; top: 0; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 15px; cursor: pointer; color: #4a90e2; font-weight: bold; }
        .tab.active { background: #4a90e2; color: white; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .category-title { color: #1e3a8a; font-weight: bold; margin: 20px 0 10px 5px; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; }
        .btn-main { width: 100%; padding: 15px; background: #4a90e2; color: white; border: none; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .stepper { display: flex; align-items: center; gap: 10px; }
        button { background: #4a90e2; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab active" onclick="go(0, this)">🏠 設定與匯總</div>
    <div class="tab" onclick="go(1, this)">🍲 點餐清單</div>
</div>

<div id="p0" class="page active">
    <div class="card">
        <label>您的姓名：</label><input type="text" id="n1" oninput="syncName(this)" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:10px;">
        <label>您的桌號：</label>
        <select id="t1" onchange="syncTable(this)" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:10px;">
            <option>1號桌</option><option>2號桌</option><option>3號桌</option><option>4號桌</option>
        </select>
    </div>
    <h3>📋 目前全場點餐進度</h3>
    <div id="records-list"></div>
</div>

<div id="p1" class="page">
    <div class="card">姓名同步：<input type="text" id="n2" readonly style="border:none; font-weight:bold;"></div>
    <div id="menu-box" class="card"></div>
    <button class="btn-main" onclick="send()">送出訂單</button>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbzs7lmm2_bW40laYkVB3fIu9-qwXz9o4He-n9iXbMZSrj78jPiyOYLQ1nnxXkZewAyI1Q/exec";
    const menuData = [
        { cat: "湯底/肉品", items: [{n:"牛骨湯底",p:450}, {n:"鴛鴦鍋",p:650}, {n:"牛肉盤",p:300}] },
        { cat: "熱炒/麻油", items: [{n:"蔥爆牛",p:180}, {n:"麻油心",p:200}] }
    ];
    let sels = {}, name = "", table = "1號桌", flatMenu = [];

    function go(i, el) {
        document.querySelectorAll('.page').forEach((p, idx) => p.className = idx===i ? 'page active' : 'page');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(el) el.classList.add('active');
        if(i===0) loadRecords();
    }

    function syncName(el) { name = el.value; document.getElementById('n2').value = name; }
    function syncTable(el) { table = el.value; }

    // 初始化菜單
    const box = document.getElementById('menu-box');
    let idx = 0;
    menuData.forEach(c => {
        box.innerHTML += `<div class="category-title">${c.cat}</div>`;
        c.items.forEach(it => {
            flatMenu.push(it);
            box.innerHTML += `<div class="food-item">${it.n} ($${it.p}) 
                <div class="stepper"><button onclick="change(${idx},-1)">-</button><input id="q${idx}" value="0" style="width:30px;text-align:center"><button onclick="change(${idx},1)">+</button></div></div>`;
            idx++;
        });
    });

    function change(i, d) { sels[i] = Math.max(0, (sels[i]||0) + d); document.getElementById('q'+i).value = sels[i]; }

    async function send() {
        if(!name) return alert("請填姓名");
        let d = "", s = 0;
        for(let k in sels) if(sels[k]>0) { d += flatMenu[k].n+"x"+sels[k]+" "; s += sels[k]*flatMenu[k].p; }
        await fetch(URL, {method:'POST', mode:'no-cors', body:JSON.stringify({name, table, details:d, total:s})});
        alert("送出成功"); location.reload();
    }

    async function loadRecords() {
        const res = await fetch(URL + "?action=read");
        const data = await res.json();
        let html = "";
        data.sort((a,b)=>parseInt(a.table)-parseInt(b.table)).forEach(r => {
            html += `<div class="card"><b>[${r.table}] ${r.name}</b><br>${r.details} | 小計: $${r.total}</div>`;
        });
        document.getElementById('records-list').innerHTML = html;
    }
    loadRecords();
</script>
</body>
</html>
