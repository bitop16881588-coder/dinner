<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聚餐點餐神器</title>
    <style>
        /* 奶油風配色與Q版字體設置 */
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');
        body { font-family: 'Comfortaa', sans-serif; background: #fdfbf7; color: #5c4e46; padding: 0; margin: 0; }
        
        /* 導覽列 */
        .tabs { display: flex; background: #f2e9e1; position: sticky; top: 0; z-index: 100; padding: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #a8968a; font-weight: bold; border-radius: 15px; }
        .tab.active { background: #dcb8a3; color: white; }

        .container { max-width: 500px; margin: auto; padding: 20px; }
        .page { display: none; }
        .page.active { display: block; }

        /* 輸入與卡片 */
        .card { background: white; padding: 15px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        select, input { width: 100%; padding: 12px; border: 2px solid #f2e9e1; border-radius: 15px; font-family: inherit; }
        
        .food-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        button { background: #dcb8a3; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; }
        
        #submit-btn { width: 100%; padding: 15px; background: #dcb8a3; color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab active" onclick="show('p1', this)">🏠 桌號</div>
    <div class="tab" onclick="show('p2', this)">🍲 點餐</div>
    <div class="tab" onclick="show('p3', this); fetchRecords()">📊 匯總</div>
</div>

<div class="container">
    <div id="p1" class="page active card">
        <label>請選擇桌號：</label>
        <select id="table-num">
            <option>1號桌</option><option>2號桌</option><option>3號桌</option>
        </select>
    </div>

    <div id="p2" class="page">
        <div class="card"><input type="text" id="user-name" placeholder="請輸入姓名"></div>
        <div id="menu-list" class="card"></div>
        <button id="submit-btn" onclick="submitOrder()">確認送出</button>
    </div>

    <div id="p3" class="page">
        <div id="records-list"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzs7lmm2_bW40laYkVB3fIu9-qwXz9o4He-n9iXbMZSrj78jPiyOYLQ1nnxXkZewAyI1Q/exec";
    
    // 渲染選單
    const menu = [{name: "牛肉盤", price: 300}, {name: "豬肉盤", price: 150}, {name: "台啤", price: 60}];
    const list = document.getElementById('menu-list');
    menu.forEach((item, i) => {
        list.innerHTML += `<div class="food-item">${item.name} ($${item.price}) 
            <div class="stepper"><button onclick="add(${i},-1)">-</button><input id="q-${i}" value="0"><button onclick="add(${i},1)">+</button></div>
        </div>`;
    });

    function show(id, tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        tab.classList.add('active');
    }

    // 這裡放入點餐與提交邏輯...
</script>
</body>
</html>
